name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q core.py main.py app.py schemas eval

      - name: Smoke tests (no API keys)
        run: PYTHONPATH=. python tests/test_core.py
